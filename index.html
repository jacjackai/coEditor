<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多栏编辑器 (动态添加分栏)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <!-- 编辑器主容器 -->
        <div class="editor-container">
            <!-- 颜色选择器 -->
            <div class="color-picker">
                <div class="color-option" style="--col: #fff"></div>
                <div class="color-option" style="--col: #ffeb3b"></div>
                <div class="color-option" style="--col: #a5d6a7"></div>
                <div class="color-option" style="--col: #90caf9"></div>
            </div>
        </div>
    </div>
    
    <!-- 模块化引入 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
